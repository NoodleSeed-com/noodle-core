# Invalid (resolution): the `get_order` operation accepts only `id`, but the tool maps a `bogus`
# argument (and omits the required `id`). Only surfaces when compiling with a catalog.
manifestVersion: "1"
server:
  name: acme_support
  version: 1.0.0
  title: Acme Support
connectors:
  acme:
    id: acme_orders
    version: 1.2.0
tools:
  - name: get_order
    description: Look up an order by its ID.
    inputSchema:
      type: object
      properties:
        order_id:
          type: string
    fulfilment:
      use: acme.get_order
      args:
        bogus: ${input.order_id}
