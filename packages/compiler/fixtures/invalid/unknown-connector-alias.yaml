# Invalid (resolution): the operation reference uses connector alias `acme`, but no `connectors`
# block declares it. Only surfaces when compiling with a catalog.
manifestVersion: "1"
server:
  name: acme_support
  version: 1.0.0
  title: Acme Support
tools:
  - name: get_order
    description: Look up an order by its ID.
    inputSchema:
      type: object
      properties:
        order_id:
          type: string
    fulfilment:
      use: acme.get_order
      args:
        id: ${input.order_id}
