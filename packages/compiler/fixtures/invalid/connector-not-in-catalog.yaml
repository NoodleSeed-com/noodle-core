# Invalid (resolution): alias `acme` pins connector `acme_orders` at version 9.9.9, which the
# catalog does not contain. Only surfaces when compiling with a catalog.
manifestVersion: "1"
server:
  name: acme_support
  version: 1.0.0
  title: Acme Support
connectors:
  acme:
    id: acme_orders
    version: 9.9.9
tools:
  - name: get_order
    description: Look up an order by its ID.
    inputSchema:
      type: object
      properties:
        order_id:
          type: string
    fulfilment:
      use: acme.get_order
      args:
        id: ${input.order_id}
