name: Feature request
description: Propose a capability for the Apache-2.0 core
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user outcome
      description: Explain who encounters the problem and what successful behavior would enable.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed public API or behavior
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
